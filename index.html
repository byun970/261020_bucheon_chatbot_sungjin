<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부천 챗봇</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --border: #e4e6eb;
    --text: #1c1e21;
    --muted: #8a8d91;
    --user-bubble: #4a7dff;
    --user-text: #ffffff;
    --ai-bubble: #eef0f3;
    --ai-text: #1c1e21;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    color: var(--text);
  }
  .app {
    max-width: 720px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    box-shadow: 0 0 24px rgba(0,0,0,0.06);
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4a7dff, #6fa3ff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }
  header .title {
    font-weight: 600;
    font-size: 16px;
  }
  header .subtitle {
    font-size: 12px;
    color: var(--muted);
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .row {
    display: flex;
    max-width: 100%;
  }
  .row.user { justify-content: flex-end; }
  .row.ai { justify-content: flex-start; }
  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .row.user .bubble {
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
  }
  .row.ai .bubble {
    background: var(--ai-bubble);
    color: var(--ai-text);
    border-bottom-left-radius: 4px;
  }
  .row.ai .bubble.typing {
    color: var(--muted);
    font-style: italic;
  }
  form#composer {
    display: flex;
    gap: 8px;
    padding: 14px 16px;
    border-top: 1px solid var(--border);
  }
  #input {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  #input:focus {
    border-color: var(--user-bubble);
  }
  #send {
    border: none;
    background: var(--user-bubble);
    color: #fff;
    border-radius: 20px;
    padding: 0 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #send:disabled {
    background: #b9c6e6;
    cursor: not-allowed;
  }
  .error {
    color: #d93025;
    font-size: 12px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="avatar">🤖</div>
      <div>
        <div class="title">부천 챗봇</div>
        <div class="subtitle">Groq · openai/gpt-oss-20b</div>
      </div>
    </header>

    <div id="messages"></div>

    <form id="composer">
      <textarea id="input" rows="1" placeholder="메시지를 입력하세요..." autofocus></textarea>
      <button id="send" type="submit">보내기</button>
    </form>
  </div>

<script>
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("composer");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  // 서버에 보낼 대화 기록 (system 메시지는 서버에서 처리)
  const history = [];

  function addBubble(role, text) {
    const row = document.createElement("div");
    row.className = "row " + (role === "user" ? "user" : "ai");
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function addTypingBubble() {
    const row = document.createElement("div");
    row.className = "row ai";
    const bubble = document.createElement("div");
    bubble.className = "bubble typing";
    bubble.textContent = "입력 중...";
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  async function sendMessage(text) {
    addBubble("user", text);
    history.push({ role: "user", content: text });

    sendBtn.disabled = true;
    const typingRow = addTypingBubble();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: text,
          history: history.slice(0, -1) // 방금 보낸 user 메시지는 서버에서 message로 따로 받음
        })
      });

      const data = await res.json();
      typingRow.remove();

      if (!res.ok) {
        addBubble("ai", "오류: " + (data.error || "답변을 가져오지 못했습니다."));
        return;
      }

      addBubble("ai", data.reply);
      history.push({ role: "assistant", content: data.reply });
    } catch (err) {
      typingRow.remove();
      addBubble("ai", "서버에 연결할 수 없습니다.");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    input.style.height = "auto";
    sendMessage(text);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });
</script>
</body>
</html>
